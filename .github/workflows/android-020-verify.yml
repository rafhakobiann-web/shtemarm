name: Verify Shtemarm Android 0.2.6 beta
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-020-verify.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify offline data sources
        run: |
          python3 android/scripts/validate_assets.py
          python3 android/scripts/audit_math_text.py
      - name: Test Android and compile debug and release variants
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify unsigned release APK exists (no publication)
        run: |
          find android/app/build/outputs/apk/release -type f -name '*.apk' -size +0c | grep -q .
      - name: Verify APK identity, declared version and debug signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          # Compare the packaged APK to the version declared by Gradle. A
          # release-candidate PR may intentionally advance the app version;
          # hardcoding an earlier release version produces a false CI failure.
          EXPECTED_CODE=$(sed -nE 's/^[[:space:]]*versionCode = .*\?: ([0-9]+)[[:space:]]*$/\1/p' android/app/build.gradle.kts)
          EXPECTED_NAME=$(sed -nE 's/^[[:space:]]*versionName = .*\?: "([^"]+)"[[:space:]]*$/\1/p' android/app/build.gradle.kts)
          test -n "$EXPECTED_CODE" && test -n "$EXPECTED_NAME"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -Fq "package: name='am.shtemarm.app'" <<< "$BADGING"
          grep -Fq "versionCode='$EXPECTED_CODE'" <<< "$BADGING"
          grep -Fq "versionName='$EXPECTED_NAME'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Shtemarm-Android-0.2.6-beta.1-Debug-Candidate
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
