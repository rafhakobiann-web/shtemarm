name: Verify Shtemarm Android 0.2.5 release candidate
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-020-verify.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify offline data sources
        run: |
          python3 android/scripts/validate_assets.py
          python3 android/scripts/audit_math_text.py
      - name: Test Android and compile debug and release variants
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Verify unsigned release APK exists (no publication)
        run: |
          find android/app/build/outputs/apk/release -type f -name '*.apk' -size +0c | grep -q .
      - name: Verify 0.2.5 APK identity and debug signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -Fq "package: name='am.shtemarm.app'" <<< "$BADGING"
          grep -Fq "versionCode='7'" <<< "$BADGING"
          grep -Fq "versionName='0.2.5'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Shtemarm-Android-0.2.5-Debug-Candidate
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
