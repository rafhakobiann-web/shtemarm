name: Verify offline English explanations
on:
  pull_request:
    paths:
      - 'src/lib/englishSectionOne*'
      - 'src/components/UnitCard.tsx'
      - '.github/workflows/verify-english-offline-explanations.yml'
  push:
    branches:
      - main
    paths:
      - 'src/lib/englishSectionOne*'
      - 'src/components/UnitCard.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/englishSectionOneMultilingual.test.ts
      - run: bun run build
