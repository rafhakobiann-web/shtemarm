name: Verify published matching Biology covers (mobile)

on:
  pull_request:
    paths:
      - '.github/workflows/live-biology-cover-style.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cover-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Install headless browser
        run: |
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium
      - name: Confirm live Biology I-IV covers all share SVG style
        run: |
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const origin = "https://shtemarm.lovable.app";
          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          try {
            const page = await browser.newPage({
              viewport: { width: 393, height: 852 }, hasTouch: true, isMobile: true,
            });
            const faults = [];
            page.on("pageerror", e => faults.push(e.message));
            const response = await page.goto(origin + "/?subject=biology", { waitUntil: "domcontentloaded", timeout: 35000 });
            if (response?.status() !== 200) throw Error("Catalog HTTP " + response?.status());
            await page.getByText("Հասանելի շտեմարաններ", { exact: true }).waitFor({ timeout: 20000 });
            for (let n = 1; n <= 4; n++) {
              const id = 30 + n;
              const card = page.locator(`a[href="/book/${id}"]`).first();
              await card.waitFor({ timeout: 10000 });
              const cover = card.locator("img").first();
              await cover.waitFor({ timeout: 10000 });
              const src = await cover.getAttribute("src");
              if (src !== `/covers/bio-${n}.svg`)
                throw Error(`Wrong live cover for Biology ${n}: ${src}`);
              const data = await cover.evaluate(img => ({
                width: img.naturalWidth, height: img.naturalHeight, complete: img.complete,
              }));
              if (!data.complete || data.width < 1 || data.height < 1)
                throw Error(`Biology ${n} cover image not loaded: ${JSON.stringify(data)}`);
              console.log(`Biology part ${n} cover: ${src} (${data.width}x${data.height})`);
            }
            for (const n of [3, 4]) {
              await page.goto(origin + "/book/" + (30 + n), { waitUntil: "domcontentloaded", timeout: 35000 });
              const cover = page.locator(`img[src="/covers/bio-${n}.svg"]`).first();
              await cover.waitFor({ timeout: 15000 });
              if (await cover.evaluate(img => img.naturalWidth) < 1) throw Error("Broken book cover " + n);
              console.log("Book detail cover OK:", n);
            }
            if (faults.length) throw Error("Production JS exceptions: " + faults.join("; "));
            console.log("PASS: all Biology I–IV cover images match design and load on live mobile site.");
          } finally { await browser.close(); }
          JS
