name: Check live Lovable Biology pages after Production publish

on:
  pull_request:
    paths:
      - '.github/workflows/live-biology-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Install Playwright isolated runtime
        run: |
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium
      - name: Check published home and both Biology routes on Android-sized Chromium
        env:
          SHTEMARM_SMOKE_ORIGIN: https://shtemarm.lovable.app
        run: node scripts/diagnose-production-runtime.mjs
