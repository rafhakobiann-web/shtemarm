name: Verify English grammar handbook
on:
  pull_request:
    paths:
      - 'src/lib/grammar*'
      - 'src/routes/english-grammar.tsx'
      - 'src/routes/level-test.$level.tsx'
      - 'src/routes/study.$bookId.$sectionId.tsx'
      - 'src/components/UnitCard.tsx'
      - 'src/test/grammar-handbook.test.ts'
      - '.github/workflows/verify-english-grammar-handbook.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/grammar*'
      - 'src/routes/english-grammar.tsx'
      - 'src/test/grammar-handbook.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/grammar-handbook.test.ts
      - run: bun run build
