name: Verify exploration-first interface

on:
  pull_request:
    paths:
      - 'src/routes/explore.tsx'
      - 'src/routes/dashboard.tsx'
      - 'src/components/AppHeader.tsx'
      - 'src/components/MobileNav.tsx'
      - 'src/components/DashboardOverview.tsx'
      - 'src/explore-2026.css'
      - 'src/routes/__root.tsx'
      - 'src/routeTree.gen.ts'
      - 'src/components/RichExplanation.tsx'
      - 'src/components/MathExplain.tsx'
      - 'src/components/UnitCard.tsx'
      - 'src/lib/explanation-steps.ts'
      - 'src/lib/math-explain.functions.ts'
      - 'src/lib/explain.functions.ts'
      - 'src/explanation-lesson.css'
      - 'src/test/explanation-steps.test.ts'
      - 'src/test/rich-explanation-lesson.test.tsx'
      - 'src/test/ai-learning.test.ts'
      - 'src/components/StudyTutorDrawer.tsx'
      - 'src/components/RichExplanation.tsx'
      - 'src/explanation-lesson.css'
      - 'src/test/rich-explanation-lesson.test.tsx'
      - 'src/test/explore-navigation.test.tsx'
      - 'src/test/mobile-liquid-nav.test.tsx'
      - 'src/test/dashboard-focus.test.tsx'
      - 'src/test/dashboard-minimal.test.ts'
      - '.github/workflows/verify-explore-ux.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify exploration, student dashboard, navigation, translations and touch behavior
        run: bunx vitest run src/test/explanation-steps.test.ts src/test/rich-explanation-lesson.test.tsx src/test/ai-learning.test.ts src/test/explore-navigation.test.tsx src/test/rich-explanation-lesson.test.tsx src/test/explanation-steps.test.ts src/test/mobile-liquid-nav.test.tsx src/test/mobile-touch.test.ts src/test/dashboard-focus.test.tsx src/test/dashboard-minimal.test.ts src/test/personal-dashboard-2026.test.ts src/test/responsive-shell-regression.test.ts src/test/academy-design.test.ts src/test/biology-original-navigation.test.ts src/test/download-scroll.test.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build website
        run: bun run build
