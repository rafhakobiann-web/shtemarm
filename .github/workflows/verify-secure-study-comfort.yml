name: Secure and comfortable study
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/verify-secure-study-comfort.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --audit-level=high
      - run: bunx tsc --noEmit
      - name: Security, scoring, question flow and navigation regressions
        run: >-
          bun run test
          src/test/study-comfort.test.tsx
          src/test/admin-session.test.ts
          src/test/security-headers.test.ts
          src/test/scoring.test.ts
          src/test/mobile-liquid-nav.test.tsx
          src/test/rich-explanations.test.tsx
          src/test/ai-budget.test.ts
          src/test/ai-learning.test.ts
          src/test/ai-runtime.test.ts
          src/test/exam.test.ts
          src/test/security-feedback-chat.test.ts
          src/test/public-auth-config.test.ts
          src/test/google-oauth-routing.test.ts
          src/test/question-answer-integrity.test.ts
      - run: bun run build
      - run: node scripts/check-repo-secrets.mjs
