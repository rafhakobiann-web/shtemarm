name: Biology backlog integrity and stable student routes

on:
  pull_request:
    paths:
      - 'src/test/biology-extended.test.ts'
      - 'src/lib/biology-extended.ts'
      - 'public/data/biology-extended-*.json'
      - 'src/test/biology-backlog-audit.test.ts'
      - 'src/test/biology-november-restorations.test.ts'
      - 'scripts/validate-biology-transcriptions.mjs'
      - 'src/test/biology-source-review-policy.test.ts'
      - 'src/lib/biology-source-format-policy.ts'
      - 'src/components/UnitCard.tsx'
      - 'public/data/biology-reviewed-restorations.json'
      - 'public/data/biology-pending-books.json'
      - 'src/test/biology-volume-three.test.ts'
      - 'src/test/ux-cleanup.test.ts'
      - 'public/data/biology-backlog-summary.json'
      - 'public/data/biology-volume3-coverage.json'
      - 'public/data/biology-volume4-coverage.json'
      - 'public/data/bio-book3.json'
      - 'public/data/bio-book4.json'
      - 'docs/biology-backlog-20261102.md'
      - 'docs/biology-next-268-source-review.json'
      - 'docs/biology-next-500-source-queue.json'
      - 'docs/biology-next-500.md'
      - 'docs/biology-final-500.md'
      - 'src/routes/book.$bookId.tsx'
      - 'src/test/biology-native-practice-no-pdf.test.ts'
      - 'docs/biology-final-500-source-queue.json'
      - 'scripts/verify-biology-all-source-coverage.mjs'
      - 'scripts/verify-biology3-completion.mjs'
      - 'scripts/verify-biology4-completion.mjs'
      - 'scripts/audit-biology4-completion.py'
      - 'src/test/biology4-claims-bundles.test.ts'
      - 'src/test/biology4-223-claims-data.test.ts'
      - 'src/lib/biology4-223-gtc-claims.review.json'
      - 'src/lib/books.ts'
      - 'docs/biology4-completion-audit-20261107.md'
      - 'docs/biology4-type-review-queue.json'
      - 'scripts/audit-biology3-completion.py'
      - 'docs/biology3-completion-audit-20261107.md'
      - 'scripts/verify-biology-final-500-source.py'
      - 'scripts/verify-biology-next-500.mjs'
      - 'scripts/verify-biology-next-500-source.py'
      - 'scripts/verify-biology-next-268.mjs'
      - 'scripts/verify-biology-next-268-source.py'
      - '.github/workflows/verify-biology-backlog.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Check all original question IDs, missing reasons, and stable routes
        run: bunx vitest run src/test/biology-backlog-audit.test.ts src/test/biology-original-bank-integrity.test.ts src/test/biology-source-review-policy.test.ts src/test/biology-section-test-routing.test.ts src/test/biology-production-regression.test.ts src/test/biology-source-banks.test.ts src/test/biology-volume-three.test.ts src/test/ux-cleanup.test.ts
      - name: Build without deploying
        run: bun run build
      - name: Verify source-page restorations and all transcribed questions
        run: |
          node scripts/validate-biology-transcriptions.mjs
          node scripts/verify-biology-next-268.mjs
          node scripts/verify-biology-next-500.mjs
          node scripts/verify-biology-all-source-coverage.mjs
          node scripts/verify-biology3-completion.mjs
          node scripts/verify-biology4-completion.mjs
          bunx vitest run src/test/biology4-claims-bundles.test.ts src/test/biology4-223-claims-data.test.ts
          bunx vitest run src/test/biology-native-practice-no-pdf.test.ts
          bunx vitest run src/test/biology-extended.test.ts src/test/biology-november-restorations.test.ts src/test/biology-original-index.test.ts src/test/biology-original-navigation.test.ts
