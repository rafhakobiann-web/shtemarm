name: Quality checks

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit and regression tests
        run: bun run test
      - name: Validate math book structure
        run: bun run validate:math
      - name: Audit math question bank and transcription coverage
        run: bun run audit:math
      - name: Verify production build
        run: bun run build
