name: Publish approved Android beta to Shtemarm website

# Not automatic. The repository contains textbook-derived educational material.
# The owner must explicitly confirm redistribution rights and beta limitations.
on:
  workflow_dispatch:
    inputs:
      content_distribution_approved:
        description: 'I confirm rights to distribute the APK and its bundled question content.'
        type: boolean
        required: true
        default: false
      beta_signing_accepted:
        description: 'I understand this is a debug-signed test APK, not a Play Store release.'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: public-android-download
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prevent replacing installed APK with a new runner debug signature
        run: |
          echo "Deprecated: a fresh debug APK uses a different signing certificate and breaks in-place updates." >&2
          echo "Use the Android 0.2.0 certificate-verified signed update workflow instead." >&2
          exit 1
      - name: Confirm distribution rights and test-build limitations
        env:
          RIGHTS: ${{ inputs.content_distribution_approved }}
          BETA_OK: ${{ inputs.beta_signing_accepted }}
        run: |
          set -euo pipefail
          if [[ "$RIGHTS" != "true" || "$BETA_OK" != "true" ]]; then
            echo 'Not published: confirm redistribution rights and beta APK limitations.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tracked-file and Git-history security checks
        run: |
          node scripts/check-repo-secrets.mjs
          python3 scripts/audit-git-history.py
          python3 android/scripts/validate_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native beta APK from current main
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK and create public metadata
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/shtemarm-android.apk
          unzip -t public/downloads/shtemarm-android.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify public/downloads/shtemarm-android.apk
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging public/downloads/shtemarm-android.apk)
          SHTEMARM_APK_VERSION=$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$BADGING" | head -n 1)
          SHTEMARM_APK_CODE=$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$BADGING" | head -n 1)
          test -n "$SHTEMARM_APK_VERSION"
          test -n "$SHTEMARM_APK_CODE"
          export SHTEMARM_APK_VERSION SHTEMARM_APK_CODE
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path("public/downloads/shtemarm-android.apk")
          payload = {
              "path": "/downloads/shtemarm-android.apk",
              "version": os.environ["SHTEMARM_APK_VERSION"],
              "version_code": int(os.environ["SHTEMARM_APK_CODE"]),
              "channel": "debug-beta",
              "size": apk.stat().st_size,
              "sha256": hashlib.file_digest(apk.open("rb"), "sha256").hexdigest(),
          }
          Path("public/downloads/android-release.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit public APK only after explicit approval
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/shtemarm-android.apk
          git add public/downloads/android-release.json
          if git diff --cached --quiet; then
            echo 'No APK changes to publish.'
            exit 0
          fi
          git commit -m 'release(web): publish owner-approved Android beta download'
          git push origin HEAD:main
