name: Verify Biology III and IV source indexing and offline PDF practice

on:
  pull_request:
    paths:
      - 'src/lib/biology-source.ts'
      - 'src/components/BiologyOriginalPractice.tsx'
      - 'src/components/BiologyWorkspace.tsx'
      - 'src/routes/biology.original.tsx'
      - 'public/data/biology-original-volume*-index.json'
      - 'public/data/biology-pending-books.json'
      - 'src/test/biology-original-index.test.ts'
      - '.github/workflows/verify-biology-original-practice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Validate source page runs, printed choices, IDs and no double-counting
        run: bunx vitest run src/test/biology-original-index.test.ts src/test/biology-volume-three.test.ts src/test/biology.test.tsx
      - name: Verify web production build (no deployment)
        run: bun run build
