name: Verify fixed English CEFR tests and official prep links

on:
  pull_request:
    paths:
      - 'src/lib/levelTests.ts'
      - 'src/lib/levelTestPracticeExtras.ts'
      - 'src/lib/officialEnglishPreparation.ts'
      - 'src/routes/level-test.$level.tsx'
      - 'src/routes/index.tsx'
      - 'src/test/translation.test.ts'
      - '.github/workflows/verify-english-level-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/translation.test.ts src/test/workbook-exams.test.ts src/test/ai-runtime.test.ts
      - run: bun run build
