name: Build update-compatible signed Android beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require persistent signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_BETA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" || -z "$EXPECTED_CERT" ]]; then
            echo "::error::Configure persistent signing secrets and ANDROID_BETA_CERT_SHA256 repository variable first."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_BETA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shtemarm-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/shtemarm-signing/beta.jks"
          chmod 600 "$RUNNER_TEMP/shtemarm-signing/beta.jks"
      - name: Validate question data
        run: |
          python3 android/scripts/validate_assets.py
          python3 android/scripts/audit_math_text.py
      - name: Build signed beta APK and unit tests
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/shtemarm-signing/beta.jks"
          gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Verify persistent certificate fingerprint
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          normalize() { printf '%s' "$1" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }
          if [[ -z "$ACTUAL" || "$(normalize "$ACTUAL")" != "$(normalize "$EXPECTED_CERT")" ]]; then
            echo "::error::APK signing certificate does not match the pinned beta certificate."
            exit 1
          fi
          echo "Verified pinned signing certificate (fingerprint hidden)."
      - name: Upload update-compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: Shtemarm-signed-beta-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/shtemarm-signing"
