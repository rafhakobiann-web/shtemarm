name: Verify Academy design system and responsive study navigation

on:
  pull_request:
    paths:
      - 'src/styles.css'
      - 'src/adaptive-design-2026.css'
      - 'src/interaction-motion-2026.css'
      - 'src/components/TouchGlassEffects.tsx'
      - 'src/lib/preview-interaction.ts'
      - 'src/lib/theme.ts'
      - 'src/routes/index.tsx'
      - 'src/routes/__root.tsx'
      - 'src/components/AppHeader.tsx'
      - 'src/components/MobileNav.tsx'
      - 'src/components/ExamDesign.tsx'
      - 'src/components/PersonalizationControls.tsx'
      - 'src/components/ui/button.tsx'
      - 'src/i18n/e.ts'
      - 'src/i18n/ru.ts'
      - 'src/test/academy-design.test.ts'
      - 'src/test/responsive-shell-regression.test.ts'
      - 'src/test/intuitive-motion.test.ts'
      - 'src/test/theme.test.ts'
      - '.github/workflows/verify-academy-design.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Validate design semantics, theme persistence and navigation
        run: bunx vitest run src/test/academy-design.test.ts src/test/responsive-shell-regression.test.ts src/test/adaptive-design.test.ts src/test/intuitive-motion.test.ts src/test/theme.test.ts src/test/app-routing.test.tsx
      - name: Build production website
        run: bun run build
