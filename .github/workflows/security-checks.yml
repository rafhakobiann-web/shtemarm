name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tracked files for secrets
        run: node scripts/check-repo-secrets.mjs
      - name: Check reachable git history for credential patterns
        run: python3 scripts/audit-git-history.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Report dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Validate security-sensitive source files
        run: |
          test -f vercel.json
          test -f SECURITY.md
          node -e "const c=require('./vercel.json'); if(!c.headers?.length)process.exit(1)"
