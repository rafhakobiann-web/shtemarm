name: Check history and biology updates

on:
  pull_request:
    paths:
      - 'src/components/History*'
      - 'src/components/Biology*'
      - 'src/lib/history*'
      - 'src/lib/books.ts'
      - 'src/routes/history.tsx'
      - 'src/routes/biology.tsx'
      - 'src/routes/index.tsx'
      - 'src/routes/book.$bookId.tsx'
      - 'src/test/history.test.tsx'
      - 'src/test/history-source-page4-spotcheck.test.ts'
      - 'scripts/audit-history-source-gaps.mjs'
      - 'scripts/audit-history-source-gaps.test.mjs'
      - 'public/data/history-bank-book1.json'
      - 'public/data/history-book1.json'
      - 'src/test/history-source-page5-spotcheck.test.ts'
      - 'src/test/history-source-page6-spotcheck.test.ts'
      - 'src/test/history-source-page8-spotcheck.test.ts'
      - 'src/test/biology.test.tsx'
      - 'scripts/sync-official-exams*'
      - 'public/data/*-official-catalog.json'
      - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: node --test scripts/sync-official-exams.test.mjs
      - name: Check original History Volume I source gap mappings
        run: |
          node --test scripts/audit-history-source-gaps.test.mjs
          node scripts/audit-history-source-gaps.mjs > history-book1-gap-review.json
      - run: bunx vitest run src/test/history-source-page4-spotcheck.test.ts src/test/history-source-page5-spotcheck.test.ts src/test/history-source-page6-spotcheck.test.ts src/test/history-source-page8-spotcheck.test.ts src/test/history.test.tsx src/test/biology.test.tsx src/test/scoring.test.ts
      - run: bun run build
      - name: Upload review-only source gap inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-book1-source-gap-inventory
          path: history-book1-gap-review.json
          if-no-files-found: ignore
