name: Verify text-only book and Biology study UX

on:
  pull_request:
    paths:
      - 'src/routes/index.tsx'
      - 'src/routes/book.$bookId.tsx'
      - 'src/components/PhysicsWorkspace.tsx'
      - 'src/components/BiologyOriginalPractice.tsx'
      - 'src/components/BiologyQuestionFromPdf.tsx'
      - 'src/lib/biology-pdf-text.ts'
      - 'src/test/ux-cleanup.test.ts'
      - 'src/test/text-only-study.test.ts'
      - '.github/workflows/verify-text-only-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check text-only books, scoring safety and existing source tests
        run: bunx vitest run src/test/text-only-study.test.ts src/test/biology-pdf-text.test.ts src/test/biology-original-index.test.ts src/test/biology-original-navigation.test.ts src/test/ux-cleanup.test.ts src/test/website-book-navigation.test.ts
      - name: Build website for production without deploying
        run: bun run build
