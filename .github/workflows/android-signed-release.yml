name: Build and publish signed Shtemarm Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android version name'
        required: true
        default: '0.4.0'
        type: string
      version_code:
        description: 'Increasing Android version code'
        required: true
        default: '13'
        type: string
      publish_to_website:
        description: 'Also publish the signed APK and manifest to the public website'
        required: true
        default: false
        type: boolean
      content_distribution_approved:
        description: 'I confirm I have rights to distribute all bundled textbook-derived question content'
        required: true
        default: false
        type: boolean
      replace_existing_apk:
        description: 'I approve replacing the current public APK after exact signing-certificate verification'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: shtemarm-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require explicit approval for website publication
        if: ${{ inputs.publish_to_website }}
        env:
          RIGHTS: ${{ inputs.content_distribution_approved }}
          REPLACE: ${{ inputs.replace_existing_apk }}
        run: |
          set -euo pipefail
          if [[ "$RIGHTS" != "true" || "$REPLACE" != "true" ]]; then
            echo "Website publication requires confirming content distribution rights and approving replacement of the current APK." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Security and offline-content checks
        run: |
          node scripts/check-repo-secrets.mjs
          python3 scripts/audit-git-history.py
          python3 android/scripts/validate_assets.py
          python3 android/scripts/audit_math_text.py

      - name: Load persistent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shtemarm-release.jks"
          chmod 600 "$RUNNER_TEMP/shtemarm-release.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/shtemarm-release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK and Android App Bundle
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease bundleRelease \
            "-Pshtemarm.versionName=$VERSION_NAME" \
            "-Pshtemarm.versionCode=$VERSION_CODE"

      - name: Verify package, version, and signature
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -Fq "package: name='am.shtemarm.app'" <<< "$BADGING"
          grep -Fq "versionCode='$VERSION_CODE'" <<< "$BADGING"
          grep -Fq "versionName='$VERSION_NAME'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$RUNNER_TEMP/shtemarm-release.apk.sha256"
          cp "$RUNNER_TEMP/shtemarm-release.apk.sha256" android/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Verify safe in-place upgrade before public replacement
        if: ${{ inputs.publish_to_website }}
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          OLD=public/downloads/shtemarm-android.apk
          NEW=android/app/build/outputs/apk/release/app-release.apk
          test -s "$OLD" || { echo "Current public APK is missing; refusing replacement." >&2; exit 1; }
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$SIGNER" verify --verbose "$OLD"
          old_cert=$("$SIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          new_cert=$("$SIGNER" verify --print-certs "$NEW" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$old_cert" && test -n "$new_cert"
          if [[ "$old_cert" != "$new_cert" ]]; then
            echo "Blocked: the new APK certificate differs from the current public APK. Do not overwrite installed builds; resolve the signing key or migration first." >&2
            exit 1
          fi
          old_code=$("$AAPT" dump badging "$OLD" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)
          new_code=$("$AAPT" dump badging "$NEW" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" | head -n 1)
          old_package=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          new_package=$("$AAPT" dump badging "$NEW" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          test "$old_package" = "am.shtemarm.app" && test "$new_package" = "$old_package"
          test "$new_code" = "$VERSION_CODE"
          test "$new_code" -gt "$old_code"

      - name: Prepare website APK and release manifest
        if: ${{ inputs.publish_to_website }}
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/shtemarm-android.apk
          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path("public/downloads/shtemarm-android.apk")
          metadata = {
              "path": "/downloads/shtemarm-android.apk",
              "version": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "channel": "signed-public",
              "size": apk.stat().st_size,
              "sha256": hashlib.file_digest(apk.open("rb"), "sha256").hexdigest(),
          }
          Path("public/downloads/android-release.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish signed APK through website
        if: ${{ inputs.publish_to_website }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/shtemarm-android.apk
          git add public/downloads/android-release.json
          if git diff --cached --quiet; then
            echo "No website APK changes to publish."
            exit 0
          fi
          git commit -m "release(android): publish signed $VERSION_NAME download"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: shtemarm-signed-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
