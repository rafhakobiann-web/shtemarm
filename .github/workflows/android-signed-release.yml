name: Build signed Shtemarm Android release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name for signed candidate, e.g. 0.1.1-beta.1'
        required: true
        default: '0.3.2'
        type: string
      version_code:
        description: 'Increasing integer Android version code'
        required: true
        default: '11'
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Security and offline-data checks
        run: |
          node scripts/check-repo-secrets.mjs
          python3 scripts/audit-git-history.py
          python3 android/scripts/validate_assets.py
      - name: Require persistent signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure the four ANDROID_ signing secrets in GitHub repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shtemarm-release.jks"
          chmod 600 "$RUNNER_TEMP/shtemarm-release.jks"
          test -s "$RUNNER_TEMP/shtemarm-release.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/shtemarm-release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK and Android App Bundle
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease bundleRelease \
            "-Pshtemarm.versionName=$VERSION_NAME" \
            "-Pshtemarm.versionCode=$VERSION_CODE"
      - name: Verify release APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk
      - name: Verify persistent release signing certificate
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_SHA256" ]]; then
            echo "Missing repository variable ANDROID_RELEASE_CERT_SHA256. Pin the SHA-256 fingerprint before releasing." >&2
            exit 1
          fi
          APK=android/app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          NORMALIZE='tr -d "[:space:]:" | tr "[:upper:]" "[:lower:]"'
          ACTUAL=$(printf '%s' "$ACTUAL" | eval "$NORMALIZE")
          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" | eval "$NORMALIZE")
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Signing certificate mismatch. Release blocked to protect in-place updates." >&2
            exit 1
          fi
          echo "Verified expected permanent signing certificate."
      - uses: actions/upload-artifact@v4
        with:
          name: shtemarm-signed-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
