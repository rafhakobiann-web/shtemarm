name: Verify GTC exam blueprints and subject banks

on:
  pull_request:
    paths:
      - 'src/lib/gtc-blueprints.ts'
      - 'src/components/GtcGuidePanel.tsx'
      - 'src/components/UnitCard.tsx'
      - 'src/components/HistoryWorkspace.tsx'
      - 'src/components/BiologyWorkspace.tsx'
      - 'src/components/WorkbookExamWorkspace.tsx'
      - 'src/lib/workbook-exams.ts'
      - 'src/routes/subject.$subject.tsx'
      - 'src/routes/index.tsx'
      - 'src/routes/book.$bookId.tsx'
      - 'src/lib/books.ts'
      - 'public/data/original-*.json'
      - 'src/test/gtc-blueprints.test.ts'
      - '.github/workflows/verify-gtc-2027.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/gtc-blueprints.test.ts src/test/workbook-exams.test.ts src/test/history.test.tsx src/test/biology.test.tsx src/test/scoring.test.ts
      - run: bun run build
