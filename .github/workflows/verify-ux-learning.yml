name: Verify UX, Russian UI, Biology and study tools

on:
  pull_request:
    paths:
      - 'src/lib/lang.ts'
      - 'src/i18n/ru.ts'
      - 'src/components/AppHeader.tsx'
      - 'src/components/PersonalizationControls.tsx'
      - 'src/components/MobileNav.tsx'
      - 'src/components/BiologyWorkspace.tsx'
      - 'src/lib/books.ts'
      - 'src/lib/miniGameBank.ts'
      - 'src/routes/mini-games.tsx'
      - 'src/routes/thematic.tsx'
      - 'src/routes/flashcards.tsx'
      - 'src/routes/study-tools.tsx'
      - 'src/routes/index.tsx'
      - 'src/routes/__root.tsx'
      - 'src/styles.css'
      - 'src/test/ux-learning.test.ts'
      - '.github/workflows/verify-ux-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/ux-learning.test.ts src/test/biology.test.tsx src/test/workbook-exams.test.ts src/test/translation.test.ts src/test/ai-runtime.test.ts
      - run: bun run build
