name: Verify consistent Biology book covers

on:
  pull_request:
    paths:
      - 'public/covers/bio-3.svg'
      - 'public/covers/bio-4.svg'
      - 'src/lib/books.ts'
      - 'src/routes/index.tsx'
      - 'src/test/biology-covers-consistency.test.ts'
      - '.github/workflows/verify-biology-covers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test 4 Biology covers and regression for text questions
        run: bunx vitest run src/test/biology-covers-consistency.test.ts src/test/auth-and-covers.test.ts src/test/biology-source-banks.test.ts
      - name: Build production website without deploying
        run: bun run build
