name: Diagnose production runtime loading (mobile Chromium)

on:
  pull_request:
    paths:
      - 'scripts/diagnose-production-runtime.mjs'
      - '.github/workflows/diagnose-production-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Test live HTTP response (no tokens, no secrets)
        run: |
          for path in / /biology /biology/original; do
            echo "URL https://shtemarm.lovable.app$path"
            curl -IL --max-time 20 -sS -o /dev/null -w 'http_code=%{http_code} effective_url=%{url_effective} time=%{time_total}\n' "https://shtemarm.lovable.app$path" || true
          done
      - name: Install smoke-test-only Chromium
        run: |
          bun add --no-save playwright@1.56.1
          bunx playwright install --with-deps chromium
      - name: Diagnose runtime errors and visible root boundary
        run: node scripts/diagnose-production-runtime.mjs
