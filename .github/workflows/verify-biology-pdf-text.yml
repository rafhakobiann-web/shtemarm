name: Verify source-derived Biology question text and PDF renderer

on:
  pull_request:
    paths:
      - 'src/lib/biology-pdf-text.ts'
      - 'src/components/BiologyQuestionFromPdf.tsx'
      - 'src/components/BiologyOriginalPractice.tsx'
      - 'src/test/biology-pdf-text.test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/verify-biology-pdf-text.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile
      - name: Check source-text transformation, source page segmentation and source PDF data index
        run: bunx vitest run src/test/biology-pdf-text.test.ts src/test/biology-original-index.test.ts
      - name: Verify production build and bundled PDF worker (no deployment)
        run: bun run build
      - name: Verify new Biology reader TypeScript errors separately from pre-existing repository errors
        run: |
          bunx tsc --noEmit --pretty false > /tmp/shtemarm-ts-errors.log 2>&1 || true
          if grep -E '^src/(lib/biology-pdf-text\.ts|components/BiologyQuestionFromPdf\.tsx|components/BiologyOriginalPractice\.tsx)' /tmp/shtemarm-ts-errors.log; then
            echo "New Biology PDF reader types must be fixed"
            exit 1
          fi
          echo "No TS errors in the new PDF reader files; unrelated existing repository diagnostics are not included in this PR."
