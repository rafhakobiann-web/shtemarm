name: Verify landing, authentication and dashboard
on:
  pull_request:
    paths:
      - 'src/routes/index.tsx'
      - 'src/routes/download.tsx'
      - 'src/components/LandingShowcase.tsx'
      - 'src/landing-editorial-2026.css'
      - 'netlify.toml'
      - 'src/lib/app-download.ts'
      - 'src/test/landing-editorial-2026.test.ts'
      - 'src/test/download-scroll.test.ts'
      - 'src/routes/dashboard.tsx'
      - 'src/routes/onboarding.tsx'
      - 'src/routes/auth.tsx'
      - 'src/routes/__root.tsx'
      - 'src/lib/onboarding.ts'
      - 'src/test/onboarding.test.ts'
      - '.github/workflows/verify-landing-auth.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Regression tests
        run: bunx vitest run src/test/onboarding.test.ts src/test/legacy-mistake-recovery.test.ts src/test/landing-editorial-2026.test.ts src/test/download-scroll.test.ts
      - name: Website production build
        run: bun run build
