name: Verify auth, covers and Biology original-book integrity

on:
  pull_request:
    paths:
      - 'src/routes/auth.tsx'
      - 'src/lib/auth-feedback.ts'
      - 'src/lib/google-oauth-routing.ts'
      - 'src/test/google-oauth-routing.test.ts'
      - 'src/components/BookCover.tsx'
      - 'src/routes/index.tsx'
      - 'src/routes/book.$bookId.tsx'
      - 'src/test/auth-and-covers.test.ts'
      - 'src/test/biology-original-bank-integrity.test.ts'
      - 'src/test/text-only-study.test.ts'
      - 'src/test/ux-cleanup.test.ts'
      - '.github/workflows/verify-auth-covers-biology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Validate source question pages, answer keys and cover assets
        run: bunx vitest run src/test/google-oauth-routing.test.ts src/test/auth-and-covers.test.ts src/test/biology-original-bank-integrity.test.ts src/test/biology-source-banks.test.ts src/test/biology-original-navigation.test.ts src/test/text-only-study.test.ts src/test/ux-cleanup.test.ts
      - name: Build full production website without deploying
        run: bun run build
