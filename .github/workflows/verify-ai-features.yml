name: Verify AI chatbot, translation, calculator and math latency

on:
  pull_request:
    paths:
      - 'src/lib/chat.functions.ts'
      - 'src/lib/calc.functions.ts'
      - 'src/lib/translate.functions.ts'
      - 'src/lib/explanation-providers.server.ts'
      - 'src/lib/explanation-cache.server.ts'
      - 'src/lib/ai-quota.server.ts'
      - 'src/lib/ai-quota-policy.ts'
      - 'src/lib/ai-study-modes.ts'
      - 'src/test/ai-learning.test.ts'
      - 'src/lib/explain.functions.ts'
      - 'src/lib/math-explain.functions.ts'
      - 'src/lib/question-explanations.functions.ts'
      - 'src/components/UnitCard.tsx'
      - 'src/components/MathExplain.tsx'
      - 'src/test/ai-budget.test.ts'
      - 'supabase/migrations/20261104000000_ai_request_quotas.sql'
      - 'src/routes/chat.tsx'
      - 'src/test/ai-runtime.test.ts'
      - 'src/test/explanation-providers.test.ts'
      - '.github/workflows/verify-ai-features.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/ai-runtime.test.ts src/test/explanation-providers.test.ts src/test/ai-budget.test.ts src/test/ai-learning.test.ts src/test/translation.test.ts src/test/rich-explanations.test.tsx
      - run: bun run build
