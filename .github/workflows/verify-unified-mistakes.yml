name: Verify unified mistake notebook

on:
  pull_request:
    paths:
      - 'src/lib/unitMistakes.ts'
      - 'src/lib/legacyMistakeRecovery.ts'
      - 'src/test/legacy-mistake-recovery.test.ts'
      - 'src/lib/mistakeNotebook.ts'
      - 'src/lib/mathMistakes.ts'
      - 'src/routes/mistakes.tsx'
      - 'src/components/HistorySession.tsx'
      - 'src/routes/study.$bookId.$sectionId.tsx'
      - 'src/routes/test.$bookId.tsx'
      - 'src/test/unit-mistakes.test.ts'
      - '.github/workflows/verify-unified-mistakes.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify mistake notebook storage, scoring and math regression
        run: bunx vitest run src/test/unit-mistakes.test.ts src/test/legacy-mistake-recovery.test.ts src/test/math-handbook.test.ts
      - name: Build website without deploying
        run: bun run build
