name: Check visible Biology III-IV book navigation

on:
  pull_request:
    paths:
      - 'src/routes/index.tsx'
      - 'src/routes/biology_.original.tsx'
      - 'src/components/BiologyOriginalPractice.tsx'
      - 'src/test/biology-original-navigation.test.ts'
      - '.github/workflows/verify-biology-book-navigation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Check 1-4 book cards, source routing, and source book data
        run: bunx vitest run src/test/biology-original-navigation.test.ts src/test/biology-original-index.test.ts src/test/biology-pdf-text.test.ts
      - name: Build production site without deploying
        run: bun run build
