name: Update website APK to verified Android 0.1.1 beta

# This is a one-time update from the existing, published beta APK to
# the already verified 0.1.1 APK. It does not expose the private source repo.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-web-apk-011.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-apk-011
  cancel-in-progress: false

jobs:
  update-download:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check the repository and available release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh repo view --json isPrivate -q .isPrivate)" = true
          gh release view v0.1.1-beta.1 --json tagName,isPrerelease -q '.tagName' | grep -Fx 'v0.1.1-beta.1'
          node scripts/check-repo-secrets.mjs
          python3 scripts/audit-git-history.py
          python3 android/scripts/validate_assets.py
      - name: Get the verified release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          gh release download v0.1.1-beta.1 \
            --pattern 'Shtemarm-Android-v0.1.1-beta.1.apk' \
            --dir public/downloads
          mv public/downloads/Shtemarm-Android-v0.1.1-beta.1.apk public/downloads/shtemarm-android.apk
          echo '8b73106fb52f2a2facac432311646cc88d79bd93455060b46ac8efd80e248ffa  public/downloads/shtemarm-android.apk' | sha256sum --check
          unzip -t public/downloads/shtemarm-android.apk >/dev/null
      - name: Verify version and APK certificate
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          APK=public/downloads/shtemarm-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -Fq "versionCode='4'" <<< "$BADGING"
          grep -Fq "versionName='0.1.1-beta.1'" <<< "$BADGING"
      - name: Write consistent website download metadata
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path("public/downloads/shtemarm-android.apk")
          metadata = {
              "path": "/downloads/shtemarm-android.apk",
              "version": "0.1.1-beta.1",
              "version_code": 4,
              "channel": "debug-beta",
              "size": apk.stat().st_size,
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
          }
          Path("public/downloads/android-release.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit updated APK for the existing public website download
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/downloads/shtemarm-android.apk
          git add public/downloads/android-release.json
          if git diff --cached --quiet; then
            echo 'Website already has this exact APK.'
            exit 0
          fi
          git commit -m 'release(web): update public Android download to verified 0.1.1 beta'
          git pull --rebase origin main
          git push origin HEAD:main
