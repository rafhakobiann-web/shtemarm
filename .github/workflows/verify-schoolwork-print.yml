name: Verify printable schoolwork and Russian interface

on:
  pull_request:
    paths:
      - 'src/i18n/ru.ts'
      - 'src/styles.css'
      - 'src/test/study-ux.test.tsx'
      - 'src/routes/assessment-builder.tsx'
      - '.github/workflows/verify-schoolwork-print.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/study-ux.test.tsx src/test/biology.test.tsx src/test/translation.test.ts
      - run: bun run build
