name: Verify Biology III and IV source banks
on:
  pull_request:
    paths:
      - 'public/data/bio-book[34].json'
      - 'public/data/biology-volume*-coverage.json'
      - 'src/lib/books.ts'
      - 'src/components/BiologyWorkspace.tsx'
      - 'src/routes/biology_.original.tsx'
      - 'src/routes/index.tsx'
      - 'scripts/*biology*'
      - 'src/test/biology4-claims-bundles.test.ts'
      - 'src/test/biology4-223-claims-data.test.ts'
      - 'public/data/biology4-223-gtc-claims.json'
      - 'src/lib/books.ts'
      - 'src/components/UnitCard.tsx'
      - 'src/test/biology-source-banks.test.ts'
      - '.github/workflows/verify-biology-source-banks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: node scripts/validate-biology-transcriptions.mjs
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/biology-source-banks.test.ts src/test/biology.test.tsx src/test/biology-original-index.test.ts src/test/biology-original-navigation.test.ts src/test/biology-production-regression.test.ts src/test/biology-pdf-text.test.ts
      - run: bunx vitest run src/test/biology4-claims-bundles.test.ts src/test/biology4-223-claims-data.test.ts
      - run: node scripts/verify-biology4-completion.mjs
      - run: bun run build
