name: Verify math book source instructions and answer types

on:
  pull_request:
    paths:
      - 'src/components/MathDemandReference.tsx'
      - 'src/routes/math.books.tsx'
      - 'src/routes/math.play.tsx'
      - 'src/routes/math.index.tsx'
      - 'scripts/verify-math-demands.mjs'
      - 'src/test/math-demands.test.tsx'
      - '.github/workflows/verify-math-demands.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Verify original PDF fingerprints and every source task/answer mode
        run: node scripts/verify-math-demands.mjs --output=/tmp/math-source-demand-audit.json
      - name: Test visual source-reference and answer-type regressions
        run: bunx vitest run src/test/math-demands.test.tsx src/test/math-transcriptions.test.tsx
      - name: Build entire Shtemarm site
        run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-source-demand-audit
          path: /tmp/math-source-demand-audit.json
          retention-days: 14
