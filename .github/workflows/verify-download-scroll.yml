name: Verify Android download page and smooth scrolling

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/routes/download.tsx'
      - 'src/lib/app-download.ts'
      - 'src/routes/index.tsx'
      - 'src/routes/__root.tsx'
      - 'src/components/AppHeader.tsx'
      - 'src/components/MobileNav.tsx'
      - 'src/styles.css'
      - 'src/test/download-scroll.test.ts'
      - '.github/workflows/verify-download-scroll.yml'

permissions:
  contents: read

concurrency:
  group: verify-download-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Verify download, navigation and responsive design tests
        run: bunx vitest run src/test/download-scroll.test.ts src/test/mobile-liquid-nav.test.tsx src/test/academy-design.test.ts src/test/app-routing.test.tsx
      - name: Build production website
        run: bun run build
