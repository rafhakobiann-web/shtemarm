name: Build and publish Shtemarm Android 0.3.0 beta 4 (private test release)

# Only a one-time push of this workflow onto the named release branch
# triggers publication; this does not edit production site downloads.
on:
  push:
    branches:
      - release/android-0-3-0-beta-4
    paths:
      - .github/workflows/android-030-beta4-publish.yml

permissions:
  contents: write

concurrency:
  group: shtemarm-030-beta4-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rafhakobiann-web/shtemarm' && github.ref == 'refs/heads/release/android-0-3-0-beta-4'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repository privacy and secrets audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = 'true'
          node scripts/check-repo-secrets.mjs
          python3 scripts/audit-git-history.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate bundled source assets
        run: |
          python3 android/scripts/validate_assets.py
          python3 android/scripts/audit_math_text.py
      - name: Run Android unit tests and build both APK variants
        working-directory: android
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease \
            -Pshtemarm.versionName=0.3.0-beta.4 \
            -Pshtemarm.versionCode=10 --stacktrace
      - name: Verify APK package, increasing version and signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -Fq "package: name='am.shtemarm.app'" <<< "$BADGING"
          grep -Fq "versionCode='10'" <<< "$BADGING"
          grep -Fq "versionName='0.3.0-beta.4'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Shtemarm-Android-0.3.0-beta.4-Debug-Test.apk
          sha256sum Shtemarm-Android-0.3.0-beta.4-Debug-Test.apk > Shtemarm-Android-0.3.0-beta.4-Debug-Test.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Shtemarm-Android-0.3.0-beta.4
          path: |
            Shtemarm-Android-0.3.0-beta.4-Debug-Test.apk
            Shtemarm-Android-0.3.0-beta.4-Debug-Test.apk.sha256
          if-no-files-found: error
      - name: Publish private GitHub prerelease only after successful verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.3.0-beta.4
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          # Shtemarm Android 0.3.0 beta 4
          Private debug-signed test prerelease built from merged main updates.

          - Study session saving and saved-questions loading reliability improvements
          - Improved English gap-fill source-integrity checks (no invented answers)
          - Android JSON parsing and dispatcher performance work
          - Touch navigation, mini-games and study UI improvements
          - Version code 10, package am.shtemarm.app

          This is NOT a production/Play Store-signed APK and is NOT guaranteed to
          install over older builds: Android requires the same signing certificate.
          Back up progress before replacing or uninstalling an installed version.
          Books remain incomplete until individually checked against original sources.
          This release does not change Lovable or published website download files.
          NOTES
          gh release create "$TAG" \
            Shtemarm-Android-0.3.0-beta.4-Debug-Test.apk \
            Shtemarm-Android-0.3.0-beta.4-Debug-Test.apk.sha256 \
            --target "$GITHUB_SHA" --title "Shtemarm Android 0.3.0 — Beta 4 test update" \
            --notes-file release-notes.md --prerelease
