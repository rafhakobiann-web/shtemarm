name: Resolve PDF.js lockfile for verified Biology viewer

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/resolve-biology-pdf-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/biology-original-inline-text-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/biology-original-inline-text-20261102
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Resolve pinned PDF.js using Bun
        run: bun install --lockfile-only
      - name: Commit lockfile on this feature branch, never main
        run: |
          if git diff --quiet -- bun.lock; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build(biology): lock pdfjs-dist 4.10.38"
          git push origin HEAD:feat/biology-original-inline-text-20261102
