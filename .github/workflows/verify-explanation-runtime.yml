name: Verify explanation providers and cache fallback

on:
  pull_request:
    paths:
      - 'src/lib/explain.functions.ts'
      - 'src/lib/math-explain.functions.ts'
      - 'src/lib/explanation-cache.server.ts'
      - 'src/lib/explanation-providers.server.ts'
      - 'src/test/explanation-providers.test.ts'
      - '.github/workflows/verify-explanation-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/test/explanation-providers.test.ts src/test/rich-explanations.test.tsx src/test/math-transcriptions.test.tsx
      - run: bun run build
